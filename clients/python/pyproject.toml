[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subfly"
version = "1.0.0"
description = "Client SDK for the SubFly live subtitle transcription server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SubFly contributors" }]
keywords = ["subtitles", "whisper", "kodi", "transcription"]
dependencies = []

[project.scripts]
subfly = "subfly.cli:main"

[tool.setuptools.packages.find]
include = ["subfly*"]
